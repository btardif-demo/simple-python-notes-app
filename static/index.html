<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Notes</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #282a36;
  --current: #44475a;
  --fg: #f8f8f2;
  --comment: #6272a4;
  --cyan: #8be9fd;
  --green: #50fa7b;
  --orange: #ffb86c;
  --pink: #ff79c6;
  --purple: #bd93f9;
  --red: #ff5555;
  --yellow: #f1fa8c;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0; padding: 20px;
  background: var(--bg); color: var(--fg);
  min-height: 100vh;
}
.app { max-width: 720px; margin: 0 auto; }
header { margin-bottom: 28px; }
header h1 {
  font-size: 2rem; margin: 0 0 6px 0;
  color: var(--purple);
}
header p { color: var(--comment); margin: 0; font-size: .95rem; }
.ai-badge {
  font-size: .7rem; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; vertical-align: middle; margin-left: 8px;
}
.ai-badge.enabled { background: var(--green); color: var(--bg); }
.ai-badge.disabled { background: var(--comment); color: var(--fg); }

/* Form */
.note-form {
  background: var(--current); border: 1px solid var(--comment);
  border-radius: 10px; padding: 16px; margin-bottom: 28px;
}
.note-form input, .note-form textarea {
  width: 100%; margin-bottom: 10px; padding: 10px 12px;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--comment); border-radius: 6px;
  font-family: inherit; font-size: .95rem;
  outline: none; transition: border-color .2s;
}
.note-form input:focus, .note-form textarea:focus { border-color: var(--purple); }
.note-form textarea { height: 90px; resize: vertical; }

/* Buttons */
.btn {
  cursor: pointer; margin-right: 4px; padding: 7px 16px;
  border: none; border-radius: 6px; font-size: .85rem;
  font-weight: 600; transition: opacity .15s, transform .1s;
  color: var(--bg);
}
.btn:hover { opacity: .85; }
.btn:active { transform: scale(.97); }
.form-actions .btn { background: var(--purple); }
.note-card .header-btns .btn { background: var(--comment); color: var(--fg); font-size: .78rem; padding: 4px 10px; }
.actions .btn { background: var(--current); color: var(--cyan); border: 1px solid var(--comment); font-size: .78rem; }
.actions .btn:hover { border-color: var(--cyan); }
.edit-actions .btn { background: var(--green); color: var(--bg); }
.edit-actions .btn + .btn { background: var(--comment); color: var(--fg); }

/* Note cards */
.note-card {
  background: var(--current); border: 1px solid var(--comment);
  border-radius: 10px; padding: 16px; margin-bottom: 14px;
  transition: border-color .2s;
}
.note-card:hover { border-color: var(--purple); }
.note-card-header { display: flex; justify-content: space-between; align-items: center; }
.note-card-header h3 { margin: 0; color: var(--pink); font-size: 1.1rem; }
.note-card .content { white-space: pre-wrap; margin: 10px 0; color: var(--fg); line-height: 1.5; }
.note-card .meta { font-size: .78rem; color: var(--comment); }
.note-card .actions { margin-top: 12px; display: flex; gap: 6px; }

/* AI result */
.ai-result {
  margin-top: 12px; border: 1px solid var(--green);
  border-radius: 8px; padding: 12px; background: rgba(80,250,123,.06);
}
.ai-result h4 { margin: 0 0 6px; color: var(--green); font-size: .9rem; text-transform: capitalize; }
.ai-result pre { white-space: pre-wrap; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: .88rem; color: var(--fg); margin: 0; }

/* Edit form */
.edit-form input, .edit-form textarea {
  width: 100%; margin-bottom: 8px; padding: 10px 12px;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--comment); border-radius: 6px;
  font-family: inherit; font-size: .95rem; outline: none;
}
.edit-form input:focus, .edit-form textarea:focus { border-color: var(--purple); }
.edit-form textarea { height: 70px; resize: vertical; }
.edit-actions { display: flex; gap: 6px; }

/* Spinner */
.spinner { display: inline-block; color: var(--purple); }
.spinner::after { content: "⏳ Thinking..."; }

/* Empty state */
.note-list p { color: var(--comment); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--comment); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--purple); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>BT Notes <span id="ai-badge" class="ai-badge disabled">AI Mock</span></h1>
    <p>Create notes and use AI to summarize, extract tasks, or analyze sentiment</p>
  </header>

  <form class="note-form" id="note-form">
    <input id="note-title" placeholder="Note title…" />
    <textarea id="note-content" placeholder="Write your note here…"></textarea>
    <div class="form-actions">
      <button class="btn" type="submit">Add Note</button>
    </div>
  </form>

  <div id="note-list" class="note-list"></div>
</div>

<script>
const API = '/api';
const noteList = document.getElementById('note-list');
const form = document.getElementById('note-form');
const titleInput = document.getElementById('note-title');
const contentInput = document.getElementById('note-content');
const aiBadge = document.getElementById('ai-badge');

// Check AI status
fetch(`${API}/health`).then(r => r.json()).then(d => {
  if (d.ai_enabled) { aiBadge.className = 'ai-badge enabled'; aiBadge.textContent = 'AI ON'; }
}).catch(() => {});

// Load notes
async function loadNotes() {
  try {
    const res = await fetch(`${API}/notes`);
    const notes = await res.json();
    if (notes.length === 0) {
      noteList.innerHTML = '<p>No notes yet. Create one above!</p>';
      return;
    }
    noteList.innerHTML = notes.map(n => noteCard(n)).join('');
  } catch (e) {
    noteList.innerHTML = '<div class="empty-state"><p>Failed to load notes.</p></div>';
  }
}

function noteCard(n) {
  const date = new Date(n.created_at).toLocaleString();
  return `<div class="note-card" id="note-${n.id}">
    <div class="note-card-header">
      <h3>${esc(n.title)}</h3>
      <div class="header-btns">
        <button class="btn" onclick="startEdit('${n.id}')">Edit</button>
        <button class="btn" onclick="delNote('${n.id}')">Delete</button>
      </div>
    </div>
    <div class="meta">${date}</div>
    <div class="content">${esc(n.content)}</div>
    <div class="actions">
      <button class="btn" onclick="aiAction('${n.id}','summarize',this)">Summarize</button>
      <button class="btn" onclick="aiAction('${n.id}','action_items',this)">Action Items</button>
      <button class="btn" onclick="aiAction('${n.id}','sentiment',this)">Sentiment</button>
    </div>
    <div id="ai-${n.id}"></div>
  </div>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Create note
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();
  if (!title || !content) return;
  await fetch(`${API}/notes`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content })
  });
  titleInput.value = ''; contentInput.value = '';
  loadNotes();
});

// Delete note
async function delNote(id) {
  await fetch(`${API}/notes/${id}`, { method: 'DELETE' });
  loadNotes();
}

// Edit note
async function startEdit(id) {
  const res = await fetch(`${API}/notes/${id}`);
  const n = await res.json();
  const card = document.getElementById(`note-${id}`);
  card.innerHTML = `<div class="edit-form">
    <input id="edit-title-${id}" value="${esc(n.title)}" />
    <textarea id="edit-content-${id}">${esc(n.content)}</textarea>
    <div class="edit-actions">
      <button class="btn" onclick="saveEdit('${id}')">Save</button>
      <button class="btn" onclick="loadNotes()">Cancel</button>
    </div>
  </div>`;
}

async function saveEdit(id) {
  const title = document.getElementById(`edit-title-${id}`).value.trim();
  const content = document.getElementById(`edit-content-${id}`).value.trim();
  if (!title || !content) return;
  await fetch(`${API}/notes/${id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content })
  });
  loadNotes();
}

// AI action
async function aiAction(id, action, btn) {
  const container = document.getElementById(`ai-${id}`);
  container.innerHTML = '<span class="spinner"></span>';
  const btns = btn.parentElement.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API}/notes/${id}/ai/${action}`, { method: 'POST' });
    const data = await res.json();
    container.innerHTML = `<div class="ai-result"><h4>${data.action.replace('_', ' ')}</h4><pre>${esc(data.result)}</pre></div>`;
  } catch (e) {
    container.innerHTML = `<div class="ai-result"><h4>Error</h4><pre>${e.message}</pre></div>`;
  }
  btns.forEach(b => b.disabled = false);
}

loadNotes();
</script>
</body>
</html>
